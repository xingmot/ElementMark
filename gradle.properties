org.gradle.jvmargs=-Xmx1G
loom.platform=forge

# ---Mod---

license=MIT

resource_pack_format=15

mod_version=1.0.0
mod_id=elementmark
mod_display_name=Element Mark
mod_author=xingmot
mod_description=Draws chemical element abbreviation badges (Zn, Cu, Fe...) on material items resolved from item tags. Works with GregTech, ChemLib and any mod using the c:/forge: material tag convention.
maven_group=com.xingmot.elementmark
archives_base_name=elementmark

# ---Sources---

minecraft_version=1.20.1
required_minecraft_range=${{ def ver = it.propertyString('minecraft_version'); "[$ver,${it.nextMCVersion(ver)})" }}
# UO instance runs 1.20.1-47.4.13
forge_version=47.4.13
loader_version_range=[47,)

mapping_type=official
parchment_version=
yarn_version=
custom_mapping=

use_access_widener=false
access_widener_name = ${mod_id}
generate_access_widener=true

# ---Mixin---

use_mixin=true
mixin_configs=${mod_id}.mixins
generate_mixins_json=true

# ---Compiling---

generate_sources_jar=true
generate_javadocs_jar=false

use_lombok=false

# Forge 1.20.1 runs on Java 17
target_java_version=17

use_jvmdowngrader=false
jvmdowngrader_version=1.3.3

enable_junit=false
junit_version=5.13.1

# ---Publishing---

publish_to_maven = false
publish_to_local_maven = false
maven_name = ${mod_display_name}
maven_url =

release_type = release
publish_with_changelog = ${{ it.file('CHANGELOG.md').exists() }}

publish_to_curseforge = false
curseforge_project_id =
curseforge_debug = false

publish_to_modrinth = false
modrinth_project_id =
modrinth_sync_readme = false
modrinth_debug = false

#===============================
# Dependencies
#===============================
gtceu_version=1.4.4
gtmthings_version=1.3.5.b
gtladditions_version=2.4.4Custom-fix1
ldlib_version=1.0.34
registrate_version=MC1.20-1.3.3
rhino_version=2001.2.3-build.6
kubejs_version=2001.6.5-build.14
configuration_version=2.2.0
jei_version=15.20.0.105
emi_version=1.1.21+1.20.1
jade_version=11.9.2+forge
architectury_version=9.2.14
ad_astra_version=1.15.20
botarium_version=2.3.3
resourcefullib_version=2.1.23
resourcefulconfig_version=2.1.2
