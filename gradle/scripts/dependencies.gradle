apply from: 'gradle/scripts/helpers.gradle'

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseMaven'
                url = 'https://cursemaven.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        url = "https://maven.gtceu.com"
        content {
            includeGroup "com.gregtechceu.gtceu"
        }
    }
    maven {
        name = 'Configuration'
        url = 'https://repo.repsy.io/mvn/toma/public/'
    }
    maven {
        name = 'ModdingX Maven'
        url = 'https://maven.moddingx.org/'
    }
    maven {
        name = 'IzzelAliz Maven'
        url = 'https://maven.izzel.io/releases/'
    }
    maven {
        name = 'GuideME Snapshots'
        url = 'https://central.sonatype.com/repository/maven-snapshots/'
        content {
            includeModule('org.appliedenergistics', 'guideme')
        }
    }
    maven {
        url = "https://maven.ftb.dev/releases"
        content {
            includeGroup("dev.ftb.mods")
        }
    }
    maven {
        url = "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        url = "https://maven.tterrag.com/"
        content {
            includeGroup("com.tterrag.registrate")
        }
    }
    maven {
        url = "https://modmaven.dev"
    }
    maven {
        url = "https://maven.blamejared.com/"
    }
    maven {
        url = "https://maven.terraformersmc.com/releases/"
    }
    maven {
        url = "https://maven.teamresourceful.com/repository/maven-public/"
    }
    maven {
        url = "https://maven.firstdarkdev.xyz/snapshots/"
    }
    maven {
        url = "https://maven.quiltmc.org/repository/release/"
    }
    maven {
        url = "https://maven.parchmentmc.org"
    }
    maven {
        url = "https://maven.architectury.dev/"
    }
    flatDir {
        dir "gradle/libs"
    }
    mavenLocal() // Must be last for caching to work
}

dependencies {
    // 重要前置
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:$project.mixinextras_version"))
    implementation(include("io.github.llamalad7:mixinextras-forge:$project.mixinextras_version"))

    modCompileOnly("mezz.jei:jei-$project.minecraft_version-forge:$project.jei_version") { transitive = false }
    modCompileOnly "dev.emi:emi-forge:${project.emi_version}"
//    modRuntimeOnly("mezz.jei:jei-$project.minecraft_version-forge:$project.jei_version") { transitive = false }
    modRuntimeOnly "dev.emi:emi-forge:${project.emi_version}"

    // GTCEu / LDLib：Mixin 注解处理器在编译期需要解析 @Mixin 的目标类
    // （com.gregtechceu.gtceu.api.gui.widget.TankWidget、com.lowdragmc.lowdraglib.gui.widget.TankWidget），
    // 故必须出现在 compileClasspath 上；modRuntimeOnly 仅用于 dev 环境跑起来验证注入。
    // 版本必须与整合包实装的版本一致（否则目标类/字段可能不存在），发布出的 jar 不含它们。
    modCompileOnly("com.lowdragmc.ldlib:ldlib-forge-$project.minecraft_version:$project.ldlib_version") { transitive = false }
    modCompileOnly("com.gregtechceu.gtceu:gtceu-$project.minecraft_version:$project.gtceu_version:slim") { transitive = false }

    modRuntimeOnly("com.tterrag.registrate:Registrate:$project.registrate_version")
    modRuntimeOnly("dev.toma.configuration:configuration-$project.minecraft_version:$project.configuration_version-forge") { transitive = false }
    modRuntimeOnly("com.lowdragmc.ldlib:ldlib-forge-$project.minecraft_version:$project.ldlib_version") { transitive = false }
    modRuntimeOnly("com.gregtechceu.gtceu:gtceu-$project.minecraft_version:$project.gtceu_version:slim") { transitive = false }

}

shadowJar {
    archiveClassifier.set("dev-shadow")

    // here you can relocate packages, for example:
//    relocate("io.github.classgraph", "zzzank.probejs.shaded.classgraph")
    // User Guide from the Shadow plugin itself: https://gradleup.com/shadow/

    configurations = [project.configurations.shade]
}
